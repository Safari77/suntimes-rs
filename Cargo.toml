[package]
name = "suntimes-rs"
version = "0.4.2"
publish = false
edition = "2024"
license = "GPL-3.0-only"
authors = ["Sami Farin"]

[dependencies]
# NREL SPA implementation for high precision
solar-positioning = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
tzf-rs = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
parse_datetime = "0.18"
jiff = { version = "1.0", features = ["serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
# Air-quality / pollen fetch + on-disk cache
ureq = "3"
dirs = "7"
tempfile = "3"

[profile.release]
opt-level = 3
debug = true
strip = false
lto = true
panic = "abort"

[build-dependencies]
cargo-lock = "11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(miri)'.dependencies]
jiff = { version = "1.0", features = ["tzdb-bundle-always", "serde"] }
