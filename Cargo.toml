[package]
name = "suntimes-rs"
version = "0.3.4"
publish = false
edition = "2024"
license = "GPL-3.0"
authors = ["Sami Farin"]

[dependencies]
# NREL SPA implementation for high precision
solar-positioning = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
chrono = "0.4"
chrono-tz = "0.10"
tzf-rs = "1.1"
humantime = "2.3"
iana-time-zone = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
parse_datetime = "0.15"
jiff = { version = "0.2", features = ["serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
# Air-quality / pollen fetch + on-disk cache
ureq = "3"
dirs = "6"
tempfile = "3"

[profile.release]
opt-level = 3
debug = true
strip = false
lto = true
panic = "abort"

[build-dependencies]
cargo-lock = "11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(miri)'.dependencies]
jiff = { version = "0.2", features = ["tzdb-bundle-always", "serde"] }
